spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/paotui?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: paotui
    password: paotui
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      pool-name: paotui-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.example.paotui: DEBUG

paotui:
  # 开发期允许没有限流地反复点，生产靠 nginx 限
  dev-allow-anonymous-admin: false
  bootstrap:
    staff-phone: "13800000000"
    staff-name: 老板
    staff-password: ${PAOTUI_ADMIN_PASSWORD:}
