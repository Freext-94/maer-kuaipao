spring:
  datasource:
    url: jdbc:mysql://${PAOTUI_DB_HOST:127.0.0.1}:${PAOTUI_DB_PORT:3306}/${PAOTUI_DB_NAME:paotui}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${PAOTUI_DB_USER:paotui}
    password: ${PAOTUI_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 16
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.example.paotui: INFO

paotui:
  upload-dir: ${PAOTUI_UPLOAD_DIR:/data/paotui/uploads}
  bootstrap:
    staff-phone: ${PAOTUI_ADMIN_PHONE:13800000000}
    staff-password: ${PAOTUI_ADMIN_PASSWORD:}
