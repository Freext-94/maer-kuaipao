name: Publish v1.0 container images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile-backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/maer-kuaipao-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/maer-kuaipao-backend:latest

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile-frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/maer-kuaipao-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/maer-kuaipao-web:latest
