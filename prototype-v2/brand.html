<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>品牌素材 · 马儿快跑</title>
<link rel="icon" href="assets/brand/favicon-32.png">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 品牌素材页（页面专用） */
  .intro {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--white);
    box-shadow: var(--shadow-card);
  }
  .intro img { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 13px; object-fit: contain; }
  .intro b { display: block; font-size: 14px; font-weight: 750; }
  .intro span { display: block; font-size: 11.5px; line-height: 1.45; color: var(--muted); }

  .asset { min-width: 0; }
  .asset + .asset { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .asset-hd { display: flex; align-items: center; gap: 6px; min-width: 0; margin-bottom: 8px; }
  .asset-hd .fn {
    display: inline-block;
    max-width: 100%;
    padding: 2px 6px;
    border-radius: 6px;
    background: #F1EDE3;
    color: var(--ink);
    font-size: 11.5px;
    font-weight: 650;
    line-height: 1.5;
    word-break: break-all;
  }
  .asset-hd .badge { flex: 0 0 auto; margin-left: auto; }
  .asset-meta { margin-top: 7px; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
  .asset-meta b { color: var(--ink); font-weight: 650; }

  /* 透明底用浅色棋盘格，绝不使用黄底 / 深色底 */
  .shot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-width: 0;
    min-height: 108px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background-color: #FFFFFF;
    background-image:
      linear-gradient(45deg, #EFEDE7 25%, transparent 25%),
      linear-gradient(-45deg, #EFEDE7 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #EFEDE7 75%),
      linear-gradient(-45deg, transparent 75%, #EFEDE7 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    overflow: hidden;
  }
  .shot img { display: block; width: auto; height: auto; max-width: 100%; }
  .shot.logo { min-height: 132px; }
  .shot.logo img { width: 78%; max-height: 150px; object-fit: contain; }
  .shot.hero img,
  .shot.wide img { width: 100%; max-height: none; }
  .shot.empty img { width: 68%; max-height: 130px; object-fit: contain; }
  .shot.icon img { width: 64px; height: 64px; object-fit: contain; }
  .shot.nav img { width: 40px; height: 40px; object-fit: contain; }

  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .legend .sw {
    flex: 0 0 auto;
    width: 26px;
    height: 18px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background-color: #FFFFFF;
    background-image:
      linear-gradient(45deg, #EFEDE7 25%, transparent 25%),
      linear-gradient(-45deg, #EFEDE7 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #EFEDE7 75%),
      linear-gradient(-45deg, transparent 75%, #EFEDE7 75%);
    background-size: 8px 8px;
    background-position: 0 0, 0 4px, 4px -4px, -4px 0;
  }

  .rules .steps li { font-size: 12.5px; }
  .rules .steps li b { color: var(--ink); }
  .end-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';

  var body = UI.adminPage({
    active: 'me',
    title: '品牌素材',
    sub: '固定文件名 · 同名替换 · 不改代码',
    perm: 'brand.edit'
  });
  if (!body) return;

  function esc(v) { return UI.esc(v); }

  var GROUPS = [
    {
      t: '完整 logo',
      items: [
        { f: 'logo-full.png', cls: 'logo', fmt: 'PNG', use: '浅色页面 / 文档 / 合同 / 分享图', size: '1254×1254 · 透明底' },
        { f: 'logo-card-transparent-1200.png', cls: 'logo', fmt: 'PNG', use: '深色底、启动页、登录页（白卡承载）', size: '1200×1200 · 白卡 + 透明外框' },
        { f: 'logo-on-cream-1200.png', cls: 'logo', fmt: 'PNG', use: '暖白卡片、空状态页', size: '1200×1200 · 暖白底' }
      ]
    },
    {
      t: '登录主视觉',
      items: [
        { f: 'login-hero-1200x800.png', cls: 'hero', fmt: 'PNG', use: '登录页主视觉（左标语 / 右白卡 logo）', size: '1200×800' }
      ]
    },
    {
      t: '账单头',
      items: [
        { f: 'bill-header-1200x240.png', cls: 'wide', fmt: 'PNG', use: '账单图片顶部品牌头', size: '1200×240 · 白底，左 logo 右标语' }
      ]
    },
    {
      t: '移动端头图',
      items: [
        { f: 'mobile-banner-1500x600.png', cls: 'wide', fmt: 'PNG', use: '移动端顶部品牌图', size: '1500×600 · 黑底 + 白卡 logo' }
      ]
    },
    {
      t: 'App 图标 / favicon',
      items: [
        { f: 'app-icon-192.png', cls: 'icon', fmt: 'PNG', use: 'App 图标 / 桌面快捷方式', size: '192×192 · 白底，系统自动切圆角' },
        { f: 'favicon-32.png', cls: 'icon', fmt: 'PNG', use: '浏览器标签', size: '32×32 · 简版，不要小字' },
        { f: 'favicon.svg', cls: 'icon', fmt: 'SVG', use: '浏览器标签（矢量）', size: '64×64 画布 · 简版' }
      ]
    },
    {
      t: '底部导航图标',
      items: [
        { f: 'tab-order.svg', cls: 'nav', fmt: 'SVG', use: '底部导航「订单 / 工作台」', size: '48×48 · 图标本体 24×24' },
        { f: 'tab-bill.svg', cls: 'nav', fmt: 'SVG', use: '底部导航「账单」', size: '48×48 · 图标本体 24×24' },
        { f: 'tab-user.svg', cls: 'nav', fmt: 'SVG', use: '底部导航「用户」', size: '48×48 · 图标本体 24×24' },
        { f: 'tab-customer.svg', cls: 'nav', fmt: 'SVG', use: '客户端导航「客户」', size: '48×48 · 图标本体 24×24' },
        { f: 'tab-mine.svg', cls: 'nav', fmt: 'SVG', use: '底部导航「我的」', size: '48×48 · 图标本体 24×24' }
      ]
    },
    {
      t: '服务图标',
      items: [
        { f: 'service-buy.svg', cls: 'icon', fmt: 'SVG', use: '代买跑腿', size: '96×96 · 圆角方形底' },
        { f: 'service-pickup.svg', cls: 'icon', fmt: 'SVG', use: '代取送', size: '96×96 · 圆角方形底' },
        { f: 'service-errand.svg', cls: 'icon', fmt: 'SVG', use: '代办', size: '96×96 · 圆角方形底' },
        { f: 'service-transfer.svg', cls: 'icon', fmt: 'SVG', use: '接送', size: '96×96 · 圆角方形底' },
        { f: 'service-driver.svg', cls: 'icon', fmt: 'SVG', use: '代驾', size: '96×96 · 圆角方形底' }
      ]
    },
    {
      t: '空状态',
      items: [
        { f: 'empty-orders.svg', cls: 'empty', fmt: 'SVG', use: '空订单 / 空看板', size: '480×320 · 浅底，留白多' },
        { f: 'empty-debts.svg', cls: 'empty', fmt: 'SVG', use: '空欠款 / 空账单', size: '480×320 · 浅底，留白多' },
        { f: 'empty-bills.svg', cls: 'empty', fmt: 'SVG', use: '空账单列表', size: '480×320 · 浅底，留白多' }
      ]
    }
  ];

  function itemHtml(it) {
    return '<div class="asset">' +
      '<div class="asset-hd">' +
        '<code class="fn">' + esc(it.f) + '</code>' +
        '<span class="badge ' + (it.fmt === 'SVG' ? 'green' : 'slate') + '">' + it.fmt + '</span>' +
      '</div>' +
      '<div class="shot ' + it.cls + '">' +
        '<img src="assets/brand/' + it.f + '" alt="' + esc(it.f) + '">' +
      '</div>' +
      '<div class="asset-meta"><b>用途：</b>' + esc(it.use) + '<br><b>建议尺寸：</b>' + esc(it.size) + '</div>' +
    '</div>';
  }

  function groupHtml(g) {
    return '<div class="section-title" style="margin-top:16px">' + esc(g.t) +
      ' <span class="more">' + g.items.length + ' 个文件</span></div>' +
      '<div class="card">' + g.items.map(itemHtml).join('') + '</div>';
  }

  body.innerHTML =
    '<div class="intro">' +
      '<img src="assets/brand/logo-card-transparent-1200.png" alt="">' +
      '<div class="grow" style="min-width:0">' +
        '<b>品牌素材 · 示例</b>' +
        '<span>固定文件名，同名覆盖即可；完整 logo 已含「马儿快跑」，不要再叠品牌名。</span>' +
      '</div>' +
    '</div>' +

    '<div class="section-title" style="margin-top:16px">三条硬规则</div>' +
    '<div class="card rules">' +
      '<ol class="steps">' +
        '<li><b>深色底用白卡版 logo。</b>logo-full.png 的手写「马儿快跑」是黑字，放黑底会消失；深色场景一律用 <code>logo-card-transparent-1200.png</code>。</li>' +
        '<li><b>不要放黄底。</b>logo 自带黄色圆盘，黄底会让圆盘和底色融在一起、速度线糊掉；浅色场景只用白底或暖白底。</li>' +
        '<li><b>不要重复排品牌名。</b>完整 logo 已含「马儿快跑」，旁边只写标语或服务类型。</li>' +
      '</ol>' +
    '</div>' +

    GROUPS.map(groupHtml).join('') +

    '<div class="section-title" style="margin-top:16px">替换说明</div>' +
    '<div class="card">' +
      '<div class="legend"><span class="sw" aria-hidden="true"></span><span>预览中的浅色棋盘格代表透明底；所有预览都放在白底上，不使用黄底或深色底。</span></div>' +
      '<hr class="divider">' +
      '<ol class="steps">' +
        '<li>按上表 <b>同名</b> 导出，覆盖到 <code>prototype-v2/assets/brand/</code>，刷新页面即可，不用改代码。</li>' +
        '<li>源图留在 <code>brand-kit/source/logo.png</code>，不要覆盖；换 logo 时先替换它。</li>' +
        '<li>重新生成全部尺寸：在项目根目录运行 <code>python brand-kit/build_assets.py</code>，<code>brand-kit/png/</code> 与 <code>svg/</code> 会按固定文件名重写。</li>' +
        '<li>如果文件名必须变，先改引用映射再替换，不要在页面里散落写死路径。</li>' +
      '</ol>' +
    '</div>' +

    '<div class="end-actions">' +
      '<a class="btn pri block" href="settings.html">回「我的 / 设置」</a>' +
      '<a class="btn ghost block" href="index.html">回原型导航</a>' +
    '</div>' +

    '<p class="center small muted" style="margin:14px 0 0">演示素材来自 brand-kit；正式上线前整体替换即可。</p>';
})();
</script>
</body>
</html>
