<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商家工作台 · 马儿快跑</title>
<link rel="icon" href="assets/brand/favicon-32.png">
<link rel="stylesheet" href="assets/app.css">
<style>
  .page-body { padding: 12px 14px calc(28px + env(safe-area-inset-bottom)); }

  .mbar { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; min-width: 0; }
  .mbar .seg { flex: 1; min-width: 0; }
  .mbar .seg button { min-height: 42px; padding: 0 4px; font-size: 12.5px; }
  .mbar > .btn { flex: 0 0 auto; min-height: 44px; }

  .sound-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    margin-bottom: 12px;
  }
  .sound-row .btn { flex: 0 0 auto; min-height: 44px; }
  .sound-row .small { min-width: 0; line-height: 1.4; }

  .mcard {
    min-width: 0;
    margin-bottom: 10px;
    padding: 14px;
    overflow-wrap: anywhere;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
  }
  .mcard.hot { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(245, 179, 1, .16); }

  .card-hd { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .card-hd b { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .card-hd .no { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .card-hd .badge { margin-left: auto; }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .meta-row .seq { flex: 0 0 auto; }
  .meta-row .waited { margin-left: auto; white-space: nowrap; }

  .goods {
    margin-top: 10px;
    padding: 10px 12px;
    background: #FAFAF7;
    border: 1px dashed var(--line);
    border-radius: 12px;
  }
  .goods-hd { margin-bottom: 6px; font-size: 11.5px; font-weight: 750; color: var(--muted); }
  .goods-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
    padding: 2px 0;
    font-size: 13px;
    line-height: 1.55;
  }
  .goods-item .nm { flex: 1; min-width: 0; }
  .goods-item .qty { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
  .goods-item .amt { flex: 0 0 auto; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .card-note {
    margin-top: 9px;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--cream);
    color: #6C5300;
    font-size: 12px;
    line-height: 1.55;
  }

  .amt-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px dashed var(--line);
    font-size: 12.5px;
    color: var(--muted);
  }
  .amt-row b { margin-left: auto; font-size: 17px; color: var(--ink); }

  .mbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    margin-top: 12px;
    padding: 0 16px;
    border: 1px solid var(--brand);
    border-radius: 14px;
    background: var(--brand);
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(13, 14, 17, .14);
  }
  .mbtn:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(13, 14, 17, .14); }
  .mbtn.alt {
    border-color: var(--line);
    background: var(--white);
    color: var(--ink);
    font-weight: 650;
    box-shadow: none;
  }

  .linkbtn {
    display: block;
    width: 100%;
    min-height: 44px;
    margin-top: 4px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .linkbtn:active { color: var(--ink); }
  .linkbtn.danger { color: var(--danger); }

  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 4px 0 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .pager .btn { min-width: 88px; }

  .glance {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }
  .glance > div {
    min-width: 0;
    padding: 10px 11px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--r);
  }
  .glance span { display: block; font-size: 11px; color: var(--muted); }
  .glance b { display: block; margin-top: 2px; font-size: 21px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  .hero {
    padding: 16px;
    margin-bottom: 10px;
    border-radius: var(--r-lg);
    background: var(--ink);
    color: #fff;
  }
  .hero .k { font-size: 11.5px; color: #B8B9BF; }
  .hero .t { margin-top: 3px; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
  .hero .b { margin-top: 8px; font-size: 12px; color: #D8D9DE; line-height: 1.5; }

  .kv-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 13px;
  }
  .kv-row:last-child { border-bottom: 0; }
  .kv-row .k { flex: 0 0 58px; color: var(--muted); font-size: 12px; }
  .kv-row .v { flex: 1; min-width: 0; text-align: right; }

  .history-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    min-width: 0;
  }
  .history-item:last-child { border-bottom: 0; }
  .history-item .main { flex: 1; min-width: 0; }
  .history-item .nm { font-size: 13px; font-weight: 650; }
  .history-item .sub { margin-top: 2px; font-size: 11.5px; color: var(--muted); }
  .history-item .side { flex: 0 0 auto; text-align: right; }
  .history-item .side b { display: block; font-size: 13px; font-variant-numeric: tabular-nums; }
  .history-item .side span { font-size: 11px; color: var(--muted); }

  .btn-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .btn-actions .btn { width: 100%; }

  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 2px 8px;
    font-size: 12.5px;
    font-weight: 750;
    color: var(--ink);
  }
  .section-label .more { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--muted); }

  @media (max-width: 365px) {
    .mbar .seg button { font-size: 11.5px; }
    .card-hd b { font-size: 14px; }
  }
</style>
</head>
<body>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';

  var SOUND_KEY = 'maer_merchant_sound';
  var session = null;
  var merchant = null;
  try {
    session = Store.session();
    merchant = session ? Store.merchant(session.merchantId) : null;
  } catch (e) { merchant = null; }

  var screen = UI.mobilePage({
    role: 'merchant',
    roleName: '商家工作台',
    title: merchant ? merchant.name : '商家工作台',
    sub: '待备货 · 备货完成',
    body: '<div id="view"></div>'
  });
  if (!screen) return;

  var MID = Number(session && session.merchantId);
  var tab = 'waiting';
  var pendingPage = 0;
  var PAGE_SIZE = 2;
  var soundOn = false;
  try { soundOn = localStorage.getItem(SOUND_KEY) === '1'; } catch (e) { soundOn = false; }
  var lastPendingKey = null;
  var audioCtx = null;

  function esc(v) { return UI.esc(v); }
  function money(fen) { return UI.money(fen); }

  function beep(times) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t0 = audioCtx.currentTime;
      var n = times || 2;
      for (var i = 0; i < n; i++) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = i === 0 ? 880 : 1046;
        var at = t0 + i * 0.22;
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.28, at + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(at);
        osc.stop(at + 0.18);
      }
      return true;
    } catch (e) { return false; }
  }

  function setSound(on) {
    soundOn = !!on;
    try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch (e) { /* ignore */ }
  }

  function groupsOf(o) { return Store.groupsOf(o); }

  function myGroups(o) {
    return groupsOf(o).filter(function (g) { return Number(g.merchantId) === MID; });
  }

  function isPendingGroup(o, g) {
    if (Number(g.merchantId) !== MID) return false;
    if (g.pickedAt) return false;
    if (g.prepStatus !== 'notified' && g.prepStatus !== 'silent') return false;
    return o.status !== 'CANCELLED' && o.status !== 'FINISHED';
  }

  function pendingEntries() {
    var out = [];
    (Store.get().orders || []).forEach(function (o) {
      myGroups(o).forEach(function (g) {
        if (isPendingGroup(o, g)) out.push({ o: o, g: g });
      });
    });
    return out.sort(function (a, b) {
      var ta = new Date(a.g.notifiedAt || a.o.createdAt).getTime();
      var tb = new Date(b.g.notifiedAt || b.o.createdAt).getTime();
      return ta - tb;
    });
  }

  function historyEntries() {
    var out = [];
    (Store.get().orders || []).forEach(function (o) {
      myGroups(o).forEach(function (g) {
        if (isPendingGroup(o, g)) return;
        var done = g.prepStatus === 'ready' || !!g.pickedAt || o.status === 'FINISHED' || o.status === 'CANCELLED';
        if (!done) return;
        out.push({ o: o, g: g });
      });
    });
    return out.sort(function (a, b) {
      var ta = a.g.pickedAt || a.g.readyAt || a.o.readyAt || a.o.createdAt;
      var tb = b.g.pickedAt || b.g.readyAt || b.o.readyAt || b.o.createdAt;
      return new Date(tb || 0) - new Date(ta || 0);
    });
  }

  function prepLabel(o, g) {
    if (g.prepStatus === 'silent') return '缺货已上报';
    return '待备货';
  }

  function prepColor(o, g) {
    if (g.prepStatus === 'silent') return 'red';
    return 'amber';
  }

  function historyLabel(o, g) {
    if (o.status === 'CANCELLED') return '订单已取消';
    if (o.status === 'FINISHED') return '已结单';
    if (g.pickedAt) return '骑手已取货';
    if (g.prepStatus === 'ready') return '已备货 · 等取货';
    if (g.prepStatus === 'silent') return '缺货已上报';
    return Store.statusLabel(o);
  }

  function historyColor(o, g) {
    if (o.status === 'CANCELLED') return 'red';
    if (o.status === 'FINISHED' || g.pickedAt) return 'green';
    if (g.prepStatus === 'ready') return 'blue';
    return 'slate';
  }

  function itemRows(g) {
    var items = g.items || [];
    if (!items.length) return '<div class="muted small">物品清单未填写</div>';
    return items.map(function (it) {
      var qty = Number(it.qty || 1);
      return '<div class="goods-item">' +
        '<span class="nm">' + esc(it.text || '物品') + '</span>' +
        (qty > 1 ? '<span class="qty">×' + qty + '</span>' : '') +
        '<span class="amt">' + money(it.estFen) + '</span>' +
        '</div>';
    }).join('');
  }

  function cardNotes(o, g) {
    var notes = [];
    if (g.note) notes.push(g.note);
    if (!g.note && myGroups(o).length === 1 && o.note) notes.push(o.note);
    if (!notes.length) return '';
    return '<div class="card-note">' + notes.map(function (n) {
      return '备注：' + esc(n);
    }).join('<br>') + '</div>';
  }

  function pendingCard(entry) {
    var o = entry.o, g = entry.g;
    var waited = g.notifiedAt ? UI.timeAgo(g.notifiedAt) : UI.timeAgo(o.createdAt);
    return '<article class="mcard hot">' +
      '<div class="card-hd"><b>' + esc(o.no) + '</b>' +
      '<span class="no">' + esc(UI.fmtDate(o.createdAt)) + '</span>' +
      '<span class="badge ' + prepColor(o, g) + '">' + esc(prepLabel(o, g)) + '</span></div>' +
      '<div class="meta-row"><span class="seq">本店第 ' + esc(g.seq || 1) + ' 组</span>' +
      '<span class="waited">' + esc(waited) + '</span></div>' +
      '<div class="goods"><div class="goods-hd">本店物品清单</div>' + itemRows(g) + '</div>' +
      cardNotes(o, g) +
      '<div class="amt-row"><span>本店货款估价</span><b class="num">' + money(g.goodsEstFen) + '</b></div>' +
      '<button type="button" class="mbtn" data-ready="' + o.id + '" data-group="' + g.id + '">备货完成</button>' +
      '<button type="button" class="linkbtn" data-short="' + o.id + '" data-group="' + g.id + '">上报缺货</button>' +
      '</article>';
  }

  function waitingHtml() {
    var list = pendingEntries();
    var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (pendingPage >= totalPages) pendingPage = totalPages - 1;
    if (pendingPage < 0) pendingPage = 0;
    var pageList = list.slice(pendingPage * PAGE_SIZE, pendingPage * PAGE_SIZE + PAGE_SIZE);
    var readyToday = 0;
    (Store.get().orders || []).forEach(function (o) {
      myGroups(o).forEach(function (g) {
        if (g.readyAt && UI.isToday(g.readyAt)) readyToday++;
      });
    });

    var html = '<div class="glance">' +
      '<div><span>待备货</span><b>' + list.length + '</b></div>' +
      '<div><span>今日已备货</span><b>' + readyToday + '</b></div>' +
      '<div><span>本店订单</span><b>' + (Store.get().orders || []).filter(function (o) { return myGroups(o).length > 0; }).length + '</b></div>' +
      '</div>';

    if (!list.length) {
      html += '<div class="mcard">' + UI.empty('assets/brand/empty-orders.svg', '暂时没有待备货', '新单会出现在这里，页面保持打开即可') + '</div>';
      return html;
    }

    html += pageList.map(pendingCard).join('');
    if (list.length > PAGE_SIZE) {
      html += '<div class="pager">' +
        '<button type="button" class="btn sm" data-page="prev"' + (pendingPage <= 0 ? ' disabled' : '') + '>上一页</button>' +
        '<span>' + (pendingPage + 1) + ' / ' + totalPages + '</span>' +
        '<button type="button" class="btn sm" data-page="next"' + (pendingPage >= totalPages - 1 ? ' disabled' : '') + '>下一页</button>' +
        '</div>';
    }
    return html;
  }

  function historyHtml() {
    var list = historyEntries();
    if (!list.length) {
      return '<div class="mcard">' + UI.empty('assets/brand/empty-orders.svg', '还没有历史任务', '备货完成、骑手取货后的记录会留在这里') + '</div>';
    }
    return '<div class="mcard">' +
      '<div class="row" style="margin-bottom:2px"><b>本店历史任务</b><span class="right small muted">' + list.length + ' 条</span></div>' +
      list.map(function (entry) {
        var o = entry.o, g = entry.g;
        var amount = g.goodsRealFen != null ? g.goodsRealFen : g.goodsEstFen;
        var when = g.pickedAt || g.readyAt || o.readyAt || o.createdAt;
        return '<div class="history-item">' +
          '<div class="main"><div class="nm">' + esc(o.no) + '</div>' +
          '<div class="sub">' + esc(g.merchantName || '本店') + ' · ' + esc(UI.fmtDate(when)) + '</div>' +
          '<div class="sub">' + esc((g.items || []).map(function (it) { return it.text; }).filter(Boolean).join('、') || '物品清单未填写') + '</div>' +
          '</div>' +
          '<div class="side"><b class="num">' + money(amount) + '</b>' +
          '<span class="badge ' + historyColor(o, g) + '">' + esc(historyLabel(o, g)) + '</span></div>' +
          '</div>';
      }).join('') +
      '</div>';
  }

  function mineHtml() {
    var cats = (merchant && merchant.categoryIds ? merchant.categoryIds : []).map(function (id) {
      var c = Store.category(id);
      return c ? c.name : '';
    }).filter(Boolean);
    var todayReady = 0;
    (Store.get().orders || []).forEach(function (o) {
      myGroups(o).forEach(function (g) {
        if (g.readyAt && UI.isToday(g.readyAt)) todayReady++;
      });
    });

    return '<div class="hero">' +
      '<div class="k">当前门店</div>' +
      '<div class="t">' + esc(merchant ? merchant.name : '未绑定门店') + '</div>' +
      '<div class="b">' + esc(merchant && merchant.address ? merchant.address : '门店地址未填写') + '</div>' +
      '</div>' +
      '<div class="mcard">' +
      '<div class="kv-row"><span class="k">联系电话</span><span class="v">' + esc(merchant && merchant.phone ? merchant.phone : '—') + '</span></div>' +
      '<div class="kv-row"><span class="k">经营分类</span><span class="v">' + esc(cats.length ? cats.join('、') : '—') + '</span></div>' +
      '<div class="kv-row"><span class="k">今日已备货</span><span class="v num">' + todayReady + ' 组</span></div>' +
      '<div class="kv-row"><span class="k">备货时限</span><span class="v">' + esc(merchant && merchant.prepTimeoutMin ? merchant.prepTimeoutMin + ' 分钟' : '—') + '</span></div>' +
      '</div>' +
      '<div class="mcard">' +
      '<div class="row"><b>新单提示音</b><span class="badge ' + (soundOn ? 'green' : 'slate') + ' right">' + (soundOn ? '已开启' : '未开启') + '</span></div>' +
      '<div class="small muted" style="margin-top:6px">开启后，新备货单出现时会响两声。浏览器要求先点一次按钮才能播放声音。</div>' +
      '<label class="switch" style="margin-top:8px"><input type="checkbox" id="sndToggle"' + (soundOn ? ' checked' : '') + '> 允许提示音</label>' +
      '<button type="button" class="btn block" id="sndTest" style="margin-top:8px">测试提示音</button>' +
      '</div>' +
      '<div class="mcard">' +
      '<div class="btn-actions">' +
      '<button type="button" class="btn block" id="refresh2">立即刷新</button>' +
      '<button type="button" class="btn block pri" id="switchWs">切换工作区</button>' +
      '<button type="button" class="btn block danger" id="logout">退出登录</button>' +
      '</div>' +
      '<div class="small muted" style="margin-top:10px">商家工作台只显示本店负责的商家组，看不到其它门店的物品、金额和客户信息。</div>' +
      '</div>';
  }

  function render() {
    var pending = pendingEntries();
    var key = pending.map(function (e) { return e.g.id; }).join(',');
    if (lastPendingKey !== null && key !== lastPendingKey && soundOn) {
      var oldIds = lastPendingKey ? lastPendingKey.split(',') : [];
      var hasNew = key.split(',').some(function (id) { return id && oldIds.indexOf(id) < 0; });
      if (hasNew) beep(2);
    }
    lastPendingKey = key;

    screen.innerHTML =
      '<div class="mbar">' +
      '<div class="seg">' +
      '<button type="button" data-tab="waiting" class="' + (tab === 'waiting' ? 'on' : '') + '">待备货 ' + pending.length + '</button>' +
      '<button type="button" data-tab="history" class="' + (tab === 'history' ? 'on' : '') + '">历史任务</button>' +
      '<button type="button" data-tab="mine" class="' + (tab === 'mine' ? 'on' : '') + '">我的</button>' +
      '</div>' +
      '<button type="button" class="btn sm" id="refresh">刷新</button>' +
      '</div>' +
      '<div class="sound-row">' +
      '<button type="button" class="btn sm' + (soundOn ? '' : ' pri') + '" id="sound">' + (soundOn ? '测试提示音' : '开启提示音') + '</button>' +
      '<span class="small muted">' + (soundOn ? '提示音已开启，有新单会响两声。' : '开启后新备货单会响两声。') + '</span>' +
      '</div>' +
      (tab === 'waiting' ? waitingHtml() : tab === 'history' ? historyHtml() : mineHtml());

    bind();
  }

  function bind() {
    Array.prototype.forEach.call(screen.querySelectorAll('[data-tab]'), function (b) {
      b.addEventListener('click', function () {
        tab = b.getAttribute('data-tab');
        if (tab === 'waiting') pendingPage = 0;
        render();
      });
    });

    Array.prototype.forEach.call(screen.querySelectorAll('[data-ready]'), function (b) {
      b.addEventListener('click', function () {
        try {
          Store.markReady(Number(b.getAttribute('data-ready')), Number(b.getAttribute('data-group')));
          UI.toast('已确认备货完成，骑手可以来取了', 'ok');
          render();
        } catch (e) { UI.err(e); }
      });
    });

    Array.prototype.forEach.call(screen.querySelectorAll('[data-short]'), function (b) {
      b.addEventListener('click', function () {
        openShortage(Number(b.getAttribute('data-short')), Number(b.getAttribute('data-group')));
      });
    });

    Array.prototype.forEach.call(screen.querySelectorAll('[data-page]'), function (b) {
      b.addEventListener('click', function () {
        pendingPage += b.getAttribute('data-page') === 'next' ? 1 : -1;
        render();
      });
    });

    var refresh = document.getElementById('refresh');
    if (refresh) refresh.addEventListener('click', function () {
      render();
      UI.toast('已刷新', 'ok');
    });
    var refresh2 = document.getElementById('refresh2');
    if (refresh2) refresh2.addEventListener('click', function () {
      render();
      UI.toast('已刷新', 'ok');
    });

    var sound = document.getElementById('sound');
    if (sound) sound.addEventListener('click', function () {
      if (!soundOn) setSound(true);
      var ok = beep(2);
      UI.toast(ok ? '提示音正常，页面保持打开即可' : '这个浏览器无法播放提示音', ok ? 'ok' : 'err');
      render();
    });

    var sndToggle = document.getElementById('sndToggle');
    if (sndToggle) sndToggle.addEventListener('change', function () {
      setSound(sndToggle.checked);
      if (sndToggle.checked) beep(2);
      UI.toast(sndToggle.checked ? '提示音已开启' : '提示音已关闭', 'ok');
      render();
    });
    var sndTest = document.getElementById('sndTest');
    if (sndTest) sndTest.addEventListener('click', function () {
      var ok = beep(2);
      UI.toast(ok ? '提示音正常' : '这个浏览器无法播放提示音', ok ? 'ok' : 'err');
    });

    var switchWs = document.getElementById('switchWs');
    if (switchWs) switchWs.addEventListener('click', function () { UI.switchWorkspace(); });
    var logout = document.getElementById('logout');
    if (logout) logout.addEventListener('click', function () { UI.logout(); });
  }

  function openShortage(orderId, groupId) {
    UI.modal({
      title: '上报缺货',
      okText: '提交给调度',
      body: '<div class="field"><label class="fl req">缺什么 / 少哪样</label>' +
        '<textarea id="shortText" rows="3" placeholder="例：车厘子只剩一盒，草莓卖完了"></textarea></div>' +
        '<div class="hint">上报后调度台会看到，骑手不会白跑。</div>',
      onMount: function (box) {
        setTimeout(function () {
          var el = box.querySelector('#shortText');
          if (el) el.focus();
        }, 40);
      },
      onOk: function (box) {
        var text = String(box.querySelector('#shortText').value || '').trim();
        if (!text) throw new Error('写一下缺什么');
        Store.markShortage(orderId, groupId, text);
        UI.toast('已上报缺货，调度会处理', 'ok');
        render();
      }
    });
  }

  render();

  setInterval(function () {
    if (document.querySelector('.modal-mask') || document.querySelector('.sheet-mask')) return;
    if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    render();
  }, 8000);
})();
</script>
</body>
</html>
