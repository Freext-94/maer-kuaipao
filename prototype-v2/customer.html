<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户端 · 马儿快跑</title>
<link rel="icon" href="assets/brand/favicon-32.png">
<link rel="stylesheet" href="assets/app.css">
<style>
  .page-body { padding: 12px 14px calc(92px + env(safe-area-inset-bottom)); }

  .mcard {
    min-width: 0;
    margin-bottom: 10px;
    padding: 14px;
    overflow-wrap: anywhere;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
  }

  .hero {
    padding: 17px;
    margin-bottom: 12px;
    border-radius: var(--r-lg);
    background: var(--ink);
    color: #fff;
  }
  .hero .k { font-size: 11.5px; color: #B8B9BF; }
  .hero .t { margin-top: 3px; font-size: 20px; font-weight: 800; letter-spacing: -.03em; }
  .hero .b { margin-top: 9px; font-size: 12px; color: #D8D9DE; line-height: 1.55; }
  .hero .b b { color: var(--brand); font-variant-numeric: tabular-nums; }

  .svc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .svc {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;
    min-width: 0;
    min-height: 138px;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--white);
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    box-shadow: var(--shadow-card);
    font: inherit;
  }
  .svc:active { transform: translateY(1px); border-color: var(--brand); }
  .svc img { width: 44px; height: 44px; object-fit: contain; }
  .svc-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .svc-body b { font-size: 14.5px; font-weight: 750; line-height: 1.25; }
  .svc-body span { font-size: 11.5px; line-height: 1.45; color: var(--muted); }
  .svc-body em { margin-top: 2px; font-style: normal; font-size: 11px; color: var(--brand-ink); }
  .svc-grid .svc:last-child:nth-child(odd) {
    grid-column: 1 / -1;
    min-height: 94px;
    flex-direction: row;
    align-items: center;
  }
  .svc-grid .svc:last-child:nth-child(odd) .svc-body { flex: 1; }

  .quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .quick {
    min-width: 0;
    min-height: 70px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--white);
    color: var(--ink);
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .quick:active { border-color: var(--brand); }
  .quick b { display: block; font-size: 13.5px; }
  .quick span { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .quick .money { color: var(--ink); font-variant-numeric: tabular-nums; }

  .wiz-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    min-width: 0;
  }
  .wiz-title {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 12.5px;
    font-weight: 750;
    color: var(--ink);
  }
  .wiz-bar {
    height: 6px;
    margin-bottom: 12px;
    border-radius: 999px;
    background: #E8E2D6;
    overflow: hidden;
  }
  .wiz-bar i { display: block; height: 100%; border-radius: 999px; background: var(--brand); transition: width .2s; }

  .svc-chips { margin-top: 2px; }
  .svc-chips .chip { min-height: 40px; padding: 0 12px; font-size: 12px; }
  .svc-desc {
    margin-top: 9px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.5;
  }

  .group-card {
    min-width: 0;
    margin-top: 10px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #FCFCFA;
  }
  .group-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .group-hd b { flex: 1; font-size: 13px; font-weight: 750; }
  .group-hd .rmtxt {
    min-height: 32px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--white);
    color: var(--danger);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .group-card .field { margin-bottom: 10px; }
  .group-card .field:last-child { margin-bottom: 0; }

  .item-head,
  .item-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 48px 70px 30px;
    gap: 6px;
    align-items: center;
  }
  .item-head {
    margin: 4px 0 5px;
    font-size: 10.5px;
    color: var(--muted);
  }
  .item-head span:nth-child(2),
  .item-head span:nth-child(3) { text-align: center; }
  .item-row { margin-bottom: 6px; }
  .item-row input {
    min-width: 0;
    min-height: 40px;
    padding: 7px 8px;
    border: 1px solid #DCD5C6;
    border-radius: 9px;
    background: var(--white);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
  }
  .item-row input[type="number"] { text-align: center; padding-left: 2px; padding-right: 2px; }
  .item-row .rm {
    width: 30px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .item-row .rm:active { background: #F1EDE3; }
  .item-row .rm[disabled] { visibility: hidden; }

  .addr-pick {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    min-height: 62px;
    margin-bottom: 8px;
    padding: 10px 11px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--white);
    color: var(--ink);
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .addr-pick.on { border-color: var(--brand); background: var(--cream); }
  .addr-dot {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    margin-top: 2px;
    border: 2px solid #C9C2B4;
    border-radius: 50%;
    background: var(--white);
  }
  .addr-pick.on .addr-dot { border-color: var(--brand); box-shadow: inset 0 0 0 3px var(--brand); }
  .addr-main { flex: 1; min-width: 0; }
  .addr-main b { display: block; font-size: 13px; font-weight: 700; }
  .addr-main span { display: block; margin-top: 2px; font-size: 11.5px; line-height: 1.45; color: var(--muted); }

  .addr-add {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 44px;
    margin-top: 2px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .addr-add.on { border-color: var(--brand); color: var(--brand-ink); background: var(--cream); }

  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .grid2 .field { margin-bottom: 10px; }

  .amount-box {
    margin-top: 4px;
    padding: 10px 12px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    background: #FAFAF7;
  }
  .amount-line {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 4px 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  .amount-line b { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; }
  .amount-line.total {
    margin-top: 4px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 14px;
    font-weight: 750;
    color: var(--ink);
  }
  .amount-line.total b { font-size: 19px; }

  .wiz-actions { display: flex; gap: 8px; margin-top: 4px; }
  .wiz-actions .btn { flex: 1; min-height: 48px; }

  .mbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    margin-top: 4px;
    padding: 0 16px;
    border: 1px solid var(--brand);
    border-radius: 14px;
    background: var(--brand);
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(13, 14, 17, .14);
  }
  .mbtn:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(13, 14, 17, .14); }
  .mbtn:disabled { opacity: .5; cursor: not-allowed; }

  .review-line {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 12.5px;
  }
  .review-line:last-child { border-bottom: 0; }
  .review-line .k { flex: 0 0 62px; color: var(--muted); font-size: 11.5px; }
  .review-line .v { flex: 1; min-width: 0; text-align: right; line-height: 1.5; }
  .review-need {
    margin-top: 8px;
    padding: 10px 11px;
    border-radius: 12px;
    background: #FAFAF7;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .review-need + .review-need { margin-top: 6px; }
  .review-need b { display: block; font-size: 12.5px; }
  .review-need span { color: var(--muted); }

  .card-hd { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .card-hd b { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .card-hd .no { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .card-hd .badge { margin-left: auto; }

  .order-card { cursor: pointer; }
  .order-card:active { border-color: #D8CDB7; }
  .order-main { margin-top: 7px; font-size: 13px; line-height: 1.5; }
  .order-main .muted { display: block; margin-top: 2px; font-size: 11.5px; }
  .order-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
    font-size: 11.5px;
    color: var(--muted);
  }
  .order-line .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-line b { flex: 0 0 auto; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }

  .glance {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }
  .glance > div {
    min-width: 0;
    padding: 10px 11px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--r);
  }
  .glance span { display: block; font-size: 11px; color: var(--muted); }
  .glance b { display: block; margin-top: 2px; font-size: 20px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  .detail-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    min-width: 0;
  }
  .detail-top .small { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .group-line {
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
    min-width: 0;
  }
  .group-line:last-child { border-bottom: 0; }
  .group-line .gh { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .group-line .gh b { flex: 1; min-width: 0; font-size: 12.5px; }
  .group-line .gh .badge { flex: 0 0 auto; }
  .group-line .gi { margin-top: 4px; font-size: 11.5px; color: var(--muted); line-height: 1.55; }

  .bill-hero {
    padding: 18px;
    margin-bottom: 12px;
    border-radius: var(--r-lg);
    background: linear-gradient(135deg, #0D0E11, #2A2B31);
    color: #fff;
  }
  .bill-hero .k { font-size: 11.5px; color: #B8B9BF; }
  .bill-hero .money { margin-top: 4px; font-size: 32px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .bill-hero .sub { margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255, 255, 255, .18); font-size: 11.5px; color: #D8D9DE; }
  .bill-hero .sub b { color: var(--brand); font-variant-numeric: tabular-nums; }

  .bill-order {
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
  }
  .bill-order:last-child { border-bottom: 0; }
  .bill-order .row { gap: 8px; }
  .bill-order .main { min-width: 0; }
  .bill-order .main b { display: block; font-size: 12.5px; }
  .bill-order .main span { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }
  .bill-order .amt { flex: 0 0 auto; font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .bill-order .btn { margin-top: 7px; }

  .pay-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
  }
  .pay-item:last-child { border-bottom: 0; }
  .pay-item .main { flex: 1; min-width: 0; }
  .pay-item .main b { font-size: 12.5px; }
  .pay-item .main span { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); line-height: 1.45; }
  .pay-item .amt { flex: 0 0 auto; font-size: 14px; font-weight: 750; font-variant-numeric: tabular-nums; }

  .btn-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .btn-actions .btn { width: 100%; }

  .section-title-sm {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    font-size: 13px;
    font-weight: 750;
  }
  .section-title-sm .more { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted); }

  .empty-line { padding: 12px 2px; color: var(--muted); font-size: 12px; }

  @media (max-width: 365px) {
    .svc { min-height: 132px; padding: 11px; }
    .svc img { width: 40px; height: 40px; }
    .svc-body b { font-size: 13.5px; }
    .item-head, .item-row { grid-template-columns: minmax(0, 1fr) 42px 62px 28px; }
    .glance b { font-size: 18px; }
  }
</style>
</head>
<body>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/bill-image.js"></script>
<script>
(function () {
  'use strict';

  var me = null;
  var session = null;
  var cust = null;
  try {
    me = Store.me();
    session = Store.session();
    cust = session && session.customerId ? Store.customer(session.customerId) : null;
    if (!cust && me) cust = Store.customerByUser(me.id);
  } catch (e) { cust = null; }

  var screen = UI.mobilePage({
    role: 'customer',
    roleName: '客户端',
    title: '马儿快跑',
    sub: '下单 · 我的订单 · 我的账单',
    body: '<div id="view"></div>',
    tabbar:
      '<a href="#" data-tab="home" class="on"><img src="assets/brand/tab-order.svg" alt=""><span>首页</span></a>' +
      '<a href="#" data-tab="orders"><img src="assets/brand/tab-customer.svg" alt=""><span>我的订单</span></a>' +
      '<a href="#" data-tab="billing"><img src="assets/brand/tab-bill.svg" alt=""><span>我的账单</span></a>' +
      '<a href="#" data-tab="mine"><img src="assets/brand/tab-mine.svg" alt=""><span>我的</span></a>'
  });
  if (!screen) return;

  var tab = 'home';
  var step = 0;
  var detailOrderId = null;
  var draft = null;

  var activeMerchants = (Store.get().merchants || []).filter(function (m) {
    return m.status === 'active';
  });

  function esc(v) { return UI.esc(v); }
  function money(fen) { return UI.money(fen); }

  function fen(v) {
    var n = parseFloat(String(v == null ? '' : v).replace(/[^\d.-]/g, ''));
    return isNaN(n) ? 0 : Math.round(n * 100);
  }

  function svcTypes() {
    return Store.serviceTypes().filter(function (t) { return t.enabled; }).sort(function (a, b) {
      return Number(a.sortNo || 0) - Number(b.sortNo || 0);
    });
  }

  function svcOf(o) {
    return Store.serviceType(o.serviceType) || { name: o.serviceType, icon: 'assets/brand/service-buy.svg' };
  }

  function svcIcon(t) {
    return t.icon || ('assets/brand/service-' + t.code + '.svg');
  }

  function schemaFields(st) {
    return ((st && st.schema) || []).slice().sort(function (a, b) {
      return Number(a.sortNo || 0) - Number(b.sortNo || 0);
    });
  }

  function newItem() { return { text: '', qty: 1, est: '' }; }
  function newGroup() { return { merchantId: 0, merchantName: '', note: '', items: [newItem()] }; }

  function defaultDraft(code) {
    var st = Store.serviceType(code) || svcTypes()[0];
    var addrs = (cust && cust.addresses) || [];
    return {
      serviceType: st.code,
      groups: st.formKind === 'buy' ? [newGroup()] : [],
      serviceValues: {},
      addressMode: addrs.length ? 'old' : 'new',
      addressId: addrs.length ? addrs[0].id : null,
      newAddr: {
        contactName: me ? me.name : '',
        phone: me ? me.phone : '',
        poi: '',
        detail: ''
      },
      note: '',
      feeYuan: UI.yuan(st.defaultFeeFen || 1000)
    };
  }

  function setDraftService(code) {
    var addrMode = draft.addressMode;
    var addrId = draft.addressId;
    var newAddr = draft.newAddr;
    draft = defaultDraft(code);
    draft.addressMode = addrMode;
    draft.addressId = addrId;
    draft.newAddr = newAddr;
  }

  function matchMerchant(name) {
    var n = String(name || '').trim();
    if (!n) return null;
    var hit = activeMerchants.filter(function (m) { return String(m.name).trim() === n; })[0];
    return hit || null;
  }

  function itemEstFen(it) {
    return fen(it && it.est);
  }

  function groupEstFen(g) {
    return (g.items || []).reduce(function (s, it) {
      if (!String(it.text || '').trim()) return s;
      return s + Math.max(0, itemEstFen(it));
    }, 0);
  }

  function goodsEstFen() {
    if (!draft || draft.serviceType !== 'buy') return 0;
    return (draft.groups || []).reduce(function (s, g) { return s + groupEstFen(g); }, 0);
  }

  function cleanGroups() {
    if (!draft.groups || !draft.groups.length) throw new Error('代买至少填一家要去的店');
    return draft.groups.map(function (g, idx) {
      var name = String(g.merchantName || '').trim();
      if (!name) throw new Error('第 ' + (idx + 1) + ' 家店要填商家名称');
      var items = (g.items || []).map(function (it) {
        var text = String(it.text || '').trim();
        if (!text) return null;
        var est = itemEstFen(it);
        if (est < 0) throw new Error('第 ' + (idx + 1) + ' 家店的物品估价不能为负');
        var qty = Math.max(1, Math.round(Number(it.qty) || 1));
        return { text: text, qty: qty, estFen: est };
      }).filter(Boolean);
      if (!items.length) throw new Error('第 ' + (idx + 1) + ' 家店至少要填一件物品');
      var hit = matchMerchant(name);
      return {
        merchantId: g.merchantId || (hit ? hit.id : null),
        merchantName: name,
        items: items,
        goodsEstFen: items.reduce(function (s, it) { return s + it.estFen; }, 0),
        note: String(g.note || '').trim()
      };
    });
  }

  function buildAddress() {
    var addrs = (cust && cust.addresses) || [];
    if (draft.addressMode === 'old') {
      var a = addrs.filter(function (x) { return String(x.id) === String(draft.addressId); })[0];
      if (a) {
        return {
          contactName: a.contactName || '',
          phone: a.phone || '',
          poi: a.poi || '',
          detail: a.detail || ''
        };
      }
    }
    var n = draft.newAddr || {};
    return {
      contactName: String(n.contactName || '').trim(),
      phone: String(n.phone || '').trim(),
      poi: String(n.poi || '').trim(),
      detail: String(n.detail || '').trim()
    };
  }

  function addressProblem() {
    var a = buildAddress();
    if (!a.contactName) return '请填联系人';
    if (!/^1\d{10}$/.test(a.phone)) return '手机号要填 11 位';
    if (!a.poi) return '请填小区 / 地点';
    return '';
  }

  function feeFen() { return fen(draft ? draft.feeYuan : 0); }

  function summaryOf(o) {
    if (o.serviceType === 'buy') {
      var names = Store.groupsOf(o).map(function (g) { return g.merchantName; }).filter(Boolean);
      var items = [];
      Store.groupsOf(o).forEach(function (g) {
        (g.items || []).forEach(function (it) {
          if (it.text) items.push(it.text + (Number(it.qty || 1) > 1 ? ' ×' + Number(it.qty) : ''));
        });
      });
      return (names.length ? names.join('、') + ' · ' : '') + (items.join('、') || '物品待确认');
    }
    var s = o.service || {};
    return s.content || s.dest || svcOf(o).name;
  }

  function myOrders() {
    return (Store.get().orders || []).filter(function (o) {
      return Number(o.customerId) === Number(cust && cust.id);
    }).sort(function (a, b) {
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
  }

  function billImageAvailable() {
    return !!(window.BillImage && typeof window.BillImage.open === 'function');
  }

  function billImageBtn(orderId) {

  function schemaFieldHtml(f) {
    var val = draft.serviceValues[f.key];
    var label = '<label class="fl' + (f.required ? ' req' : '') + '">' + esc(f.label || f.key) + '</label>';
    var ph = esc(f.placeholder || '');
    var key = esc(f.key);
    var opts = f.options || [];

    if (f.type === 'textarea') {
      return '<div class="field">' + label + '<textarea data-skey="' + key + '" rows="3" placeholder="' + ph + '">' +
        esc(val == null ? '' : val) + '</textarea></div>';
    }
    if (f.type === 'select') {
      return '<div class="field">' + label + '<select data-skey="' + key + '">' +
        '<option value="">请选择</option>' +
        opts.map(function (o) {
          var v = (o && typeof o === 'object') ? (o.value != null ? o.value : o.label) : o;
          var l = (o && typeof o === 'object') ? (o.label != null ? o.label : o.value) : o;
          return '<option value="' + esc(v) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>';
        }).join('') + '</select></div>';
    }
    if (f.type === 'multiselect') {
      var arr = Array.isArray(val) ? val.map(String) : [];
      return '<div class="field">' + label + '<select multiple data-skey="' + key + '" size="' + Math.min(4, Math.max(2, opts.length)) + '">' +
        opts.map(function (o) {
          var v = (o && typeof o === 'object') ? (o.value != null ? o.value : o.label) : o;
          var l = (o && typeof o === 'object') ? (o.label != null ? o.label : o.value) : o;
          return '<option value="' + esc(v) + '"' + (arr.indexOf(String(v)) >= 0 ? ' selected' : '') + '>' + esc(l) + '</option>';
        }).join('') + '</select><div class="hint">可多选</div></div>';
    }
    if (f.type === 'switch') {
      return '<div class="field"><label class="switch"><input type="checkbox" data-skey="' + key + '"' +
        (val ? ' checked' : '') + '> ' + esc(f.label || f.key) + '</label></div>';
    }
    var inputType = f.type === 'number' ? 'number' : f.type === 'phone' ? 'tel' : f.type === 'date' ? 'date' : 'text';
    var extra = f.type === 'number' ? ' step="any" inputmode="decimal"' : (f.type === 'phone' ? ' inputmode="numeric"' : '');
    return '<div class="field">' + label + '<input type="' + inputType + '" data-skey="' + key + '"' + extra +
      ' value="' + esc(val == null ? '' : val) + '" placeholder="' + ph + '"></div>';
  }

  function timelineHtml(o) {
    var st = Store.serviceType(o.serviceType) || {};
    var isBuy = st.flowKind === 'buy' || st.formKind === 'buy';
    var steps = [
      { at: o.createdAt, t: '已下单' },
      { at: o.dispatchedAt, t: '已派单' },
      { at: o.readyAt, t: isBuy ? '商家备货完成' : '待取货 / 待服务' },
      { at: o.pickedAt, t: isBuy ? '已取货' : '已取件 / 已上车' },
      { at: o.deliveringAt, t: (o.serviceType === 'transfer' || o.serviceType === 'driver') ? '行程开始' : '配送中' },
      { at: o.deliveredAt, t: '已送达' },
      { at: o.finishedAt, t: '已结单' }
    ];
    if (o.status === 'CANCELLED') steps.push({ at: o.cancelledAt, t: '订单已取消', bad: true });
    return '<ul class="timeline">' + steps.map(function (s) {
      return '<li class="' + (s.at ? 'done' : '') + (s.bad ? ' bad' : '') + '">' +
        esc(s.t) + '<span class="w">' + (s.at ? esc(UI.fmtDate(s.at)) : '待完成') + '</span></li>';
    }).join('') + '</ul>';
  }

    if (g.prepStatus === 'silent') return { t: '缺货', c: 'red' };
    if (g.prepStatus === 'notified') return { t: '待备货', c: 'amber' };
    if (g.prepStatus === 'cancelled') return { t: '已取消', c: 'red' };
    return { t: '无需备货', c: 'slate' };

      '<div class="mcard">' +
      '<div class="card-hd"><b>' + esc(svcOf(o).name) + '</b>' +
      '<span class="badge ' + Store.statusColor(o) + '">' + esc(Store.statusLabel(o)) + '</span></div>' +
      '<div class="order-main" style="margin-top:6px">' + esc(summaryOf(o)) +
      '<span class="muted">' + esc(UI.fmtDate(o.createdAt)) + '</span></div>' +
      '</div>' +
      '<div class="mcard"><div class="section-title-sm"><span>进度</span></div>' + timelineHtml(o) + '</div>' +
      groupHtml + svcHtml +
      '<div class="mcard"><div class="section-title-sm"><span>费用</span></div>' +
      '<div class="amount-box" style="margin-top:0">' +
      '<div class="amount-line"><span>货款</span><b>' + money(base - Number(o.serviceFeeFen || 0) - Number(o.extraFeeFen || 0) + Number(o.discountFen || 0)) + '</b></div>' +
      '<div class="amount-line"><span>跑腿费</span><b>' + money(o.serviceFeeFen) + '</b></div>' +
      (Number(o.extraFeeFen || 0) ? '<div class="amount-line"><span>附加费</span><b>' + money(o.extraFeeFen) + '</b></div>' : '') +
      (Number(o.discountFen || 0) ? '<div class="amount-line"><span>优惠</span><b>-' + money(o.discountFen) + '</b></div>' : '') +
      (adj ? '<div class="amount-line"><span>货款调整</span><b>' + (adj > 0 ? '+' : '') + money(adj) + '</b></div>' : '') +
      '<div class="amount-line total"><span>应收</span><b>' + money(recv) + '</b></div>' +
      '<div class="amount-line"><span>已收</span><b>' + money(paid) + '</b></div>' +
      '<div class="amount-line"><span>未收</span><b>' + money(owed) + '</b></div>' +
      '</div></div>' +
      (o.note ? '<div class="mcard"><div class="small muted">订单备注</div><div style="margin-top:4px">' + esc(o.note) + '</div></div>' : '') +
      (o.status === 'CANCELLED' && o.cancelReason
        ? '<div class="mcard"><div class="alert err small" style="margin:0">取消原因：' + esc(o.cancelReason) + '</div></div>' : '');
  }

  /* ---------- 我的账单 ---------- */
  function billingHtml() {
    var bill = null;
    try { bill = Store.customerBill(cust.id); } catch (e) {
      return '<div class="mcard">' + UI.empty('assets/brand/empty-bills.svg', '账单暂时打不开', '请稍后刷新，或联系老板') + '</div>';
    }
    var html = '<div class="bill-hero">' +
      '<div class="k">当前账单金额</div>' +
      '<div class="money">' + money(bill.owedFen) + '</div>' +
      '<div class="sub">累计已还 <b>' + money(bill.collectedFen) + '</b> · 账单由老板登记，本页只读</div>' +
      '</div>';

    html += '<div class="mcard">' +
      '<div class="section-title-sm"><span>未收订单</span><span class="more">' + bill.openOrders.length + ' 单</span></div>';
    if (!bill.openOrders.length) {
      html += '<div class="empty-line">当前没有未收订单。</div>';
    } else {
      bill.openOrders.forEach(function (o) {
        html += '<div class="bill-order">' +
          '<div class="row"><div class="main"><b>' + esc(o.no) + '</b>' +
          '<span>' + esc(UI.fmtDate(o.createdAt)) + ' · ' + esc(svcOf(o).name) + '</span></div>' +
          '<span class="amt">' + money(Store.owedOf(o)) + '</span></div>' +
          billImageBtn(o.id) +
          '</div>';
      });
    }
    html += '</div>';

    html += '<div class="mcard">' +
      '<div class="section-title-sm"><span>收款记录</span><span class="more">' + bill.payments.length + ' 笔</span></div>';
    if (!bill.payments.length) {
      html += '<div class="empty-line">还没有收款记录。</div>';
    } else {
      bill.payments.forEach(function (e) {
        var method = Store.METHOD_LABELS[e.method] || e.method || '—';
        html += '<div class="pay-item">' +
          '<div class="main"><b>已还 ' + money(Math.abs(e.amountFen)) + '</b>' +
          '<span>' + esc(method) + ' · ' + esc(UI.fmtDate(e.at)) + (e.note ? ' · ' + esc(e.note) : '') + '</span></div>' +
          '<span class="badge green">已收</span></div>';
      });
    }
    html += '</div>';
    html += '<div class="note small">这里只展示账单，不提供登记还款或修改金额；有疑问请联系老板对账。</div>';
    return html;
  }

  /* ---------- 我的 ---------- */
  function mineHtml() {
    var addrs = (cust && cust.addresses) || [];
    var bill = null;
    try { bill = Store.customerBill(cust.id); } catch (e) { bill = null; }
    var owed = bill ? bill.owedFen : 0;

    return '<div class="hero">' +
      '<div class="k">客户账号</div>' +
      '<div class="t">' + esc(me ? me.name : '客户') + '</div>' +
      '<div class="b">' + esc(me ? me.phone : '') + ' · 当前账单 <b>' + money(owed) + '</b></div>' +
      '</div>' +
      '<div class="mcard">' +
      '<div class="review-line"><span class="k">客户号</span><span class="v">#' + esc(cust ? cust.id : '—') + '</span></div>' +
      '<div class="review-line"><span class="k">常用地址</span><span class="v">' +
      (addrs.length ? addrs.map(function (a) { return esc(a.poi); }).join('、') : '还没有地址') + '</span></div>' +
      (cust && cust.note ? '<div class="review-line"><span class="k">备注</span><span class="v">' + esc(cust.note) + '</span></div>' : '') +
      '</div>' +
      '<div class="mcard">' +
      '<div class="btn-actions">' +
      '<button type="button" class="btn block" id="refreshMe">刷新数据</button>' +
      '<button type="button" class="btn block pri" id="switchWs">切换工作区</button>' +
      '<button type="button" class="btn block danger" id="logout">退出登录</button>' +
      '</div>' +
      '<div class="small muted" style="margin-top:10px">客户账单为只读展示；下单后老板会电话确认细节和费用。</div>' +
      '</div>';
  }

  function render() {
    if (!cust) {
      screen.innerHTML = '<div class="mcard">' + UI.empty('assets/brand/empty-orders.svg', '账号没有客户档案', '请联系老板绑定客户后再下单') + '</div>';
      return;
    }
    if (tab === 'home') screen.innerHTML = step ? (step === 1 ? step1Html() : step === 2 ? step2Html() : step3Html()) : homeHtml();
    else if (tab === 'orders') screen.innerHTML = ordersHtml();
    else if (tab === 'billing') screen.innerHTML = billingHtml();
    else screen.innerHTML = mineHtml();
    highlightTab();
    bind();
  }

  function highlightTab() {
    Array.prototype.forEach.call(document.querySelectorAll('.tabbar [data-tab]'), function (el) {
      el.classList.toggle('on', el.getAttribute('data-tab') === tab);
    });
  }

  function scrollTop() {
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  }

  function startOrder(code) {
    var st = Store.serviceType(code);
    if (!st) return;
    draft = defaultDraft(code);
    step = 1;
    tab = 'home';
    detailOrderId = null;
    render();
    scrollTop();
  }

  function closeWizard() {
    step = 0;
    draft = null;
    render();
    scrollTop();
  }

  function goTab(k) {
    if (k !== 'home' && step) {
      step = 0;
      draft = null;
    }
    tab = k;
    detailOrderId = null;
    render();
    scrollTop();
  }

  /* ---------- 事件绑定 ---------- */
  function bind() {
    // 顶层
    Array.prototype.forEach.call(screen.querySelectorAll('[data-svc]'), function (b) {
      b.addEventListener('click', function () { startOrder(b.getAttribute('data-svc')); });
    });
    Array.prototype.forEach.call(screen.querySelectorAll('[data-go]'), function (b) {
      b.addEventListener('click', function () { goTab(b.getAttribute('data-go')); });
    });
    Array.prototype.forEach.call(screen.querySelectorAll('[data-oid]'), function (b) {
      b.addEventListener('click', function () {
        detailOrderId = Number(b.getAttribute('data-oid'));
        render();
        scrollTop();
      });
    });
    var backOrders = document.getElementById('backOrders');
    if (backOrders) backOrders.addEventListener('click', function () {
      detailOrderId = null;
      render();
      scrollTop();
    });
    Array.prototype.forEach.call(screen.querySelectorAll('[data-billimg]'), function (b) {
      b.addEventListener('click', function () {
        try { window.BillImage.open(Number(b.getAttribute('data-billimg'))); }
        catch (e) { UI.err(e); }
      });
    });

    if (step) bindWizard();
    bindMine();
  }

  function bindMine() {
    var refresh = document.getElementById('refreshMe');
    if (refresh) refresh.addEventListener('click', function () {
      render();
      UI.toast('已刷新', 'ok');
    });
    var switchWs = document.getElementById('switchWs');
    if (switchWs) switchWs.addEventListener('click', function () { UI.switchWorkspace(); });
    var logout = document.getElementById('logout');
    if (logout) logout.addEventListener('click', function () { UI.logout(); });
  }

  function bindWizard() {
    var back = document.getElementById('wizBack');
    if (back) back.addEventListener('click', function () {
      if (step <= 1) { closeWizard(); return; }
      step -= 1;
      render();
      scrollTop();
    });
    var close = document.getElementById('wizClose');
    if (close) close.addEventListener('click', closeWizard);

    if (step === 1) bindStep1();
    if (step === 2) bindStep2();
    if (step === 3) bindStep3();
  }

  function bindStep1() {
    Array.prototype.forEach.call(screen.querySelectorAll('[data-switch]'), function (b) {
      b.addEventListener('click', function () {
        var code = b.getAttribute('data-switch');
        if (code !== draft.serviceType) {
          setDraftService(code);
          render();
          scrollTop();
        }
      });
    });

    Array.prototype.forEach.call(screen.querySelectorAll('[data-addgroup]'), function (b) {
      b.addEventListener('click', function () {
        draft.groups.push(newGroup());
        render();
        scrollTop();
      });
    });
    var addGroup = document.getElementById('addGroup');
    if (addGroup) addGroup.addEventListener('click', function () {
      draft.groups.push(newGroup());
      render();
      scrollTop();
    });

    Array.prototype.forEach.call(screen.querySelectorAll('[data-delgroup]'), function (b) {
      b.addEventListener('click', function () {
        var gi = Number(b.getAttribute('data-delgroup'));
        if (draft.groups.length <= 1) return;
        draft.groups.splice(gi, 1);
        render();
        scrollTop();
      });
    });

    Array.prototype.forEach.call(screen.querySelectorAll('[data-additem]'), function (b) {
      b.addEventListener('click', function () {
        var gi = Number(b.getAttribute('data-additem'));
        draft.groups[gi].items.push(newItem());
        render();
        scrollTop();
      });
    });

    Array.prototype.forEach.call(screen.querySelectorAll('[data-delitem]'), function (b) {
      b.addEventListener('click', function () {
        var p = String(b.getAttribute('data-delitem')).split('-');
        var gi = Number(p[0]), ii = Number(p[1]);
        var g = draft.groups[gi];
        if (!g || g.items.length <= 1) return;
        g.items.splice(ii, 1);
        render();
        scrollTop();
      });
    });

    Array.prototype.forEach.call(screen.querySelectorAll('[data-gname]'), function (el) {
      el.addEventListener('input', function () {
        var gi = Number(el.getAttribute('data-gname'));
        var g = draft.groups[gi];
        if (!g) return;
        g.merchantName = el.value;
        var hit = matchMerchant(el.value);
        g.merchantId = hit ? hit.id : 0;
      });
    });
    Array.prototype.forEach.call(screen.querySelectorAll('[data-gnote]'), function (el) {
      el.addEventListener('input', function () {
        var g = draft.groups[Number(el.getAttribute('data-gnote'))];
        if (g) g.note = el.value;
      });
    });
    Array.prototype.forEach.call(screen.querySelectorAll('[data-itext]'), function (el) {
      el.addEventListener('input', function () {
        var p = String(el.getAttribute('data-itext')).split('-');
        var g = draft.groups[Number(p[0])];
        if (g && g.items[Number(p[1])]) g.items[Number(p[1])].text = el.value;
      });
    });
    Array.prototype.forEach.call(screen.querySelectorAll('[data-iqty]'), function (el) {
      el.addEventListener('input', function () {
        var p = String(el.getAttribute('data-iqty')).split('-');
        var g = draft.groups[Number(p[0])];
        if (g && g.items[Number(p[1])]) g.items[Number(p[1])].qty = el.value;
      });
    });
    Array.prototype.forEach.call(screen.querySelectorAll('[data-iest]'), function (el) {
      el.addEventListener('input', function () {
        var p = String(el.getAttribute('data-iest')).split('-');
        var g = draft.groups[Number(p[0])];
        if (g && g.items[Number(p[1])]) g.items[Number(p[1])].est = el.value;
      });
    });

    Array.prototype.forEach.call(screen.querySelectorAll('[data-skey]'), function (el) {
      function read() {
        var key = el.getAttribute('data-skey');
        if (el.tagName === 'SELECT' && el.multiple) {
          draft.serviceValues[key] = Array.prototype.map.call(el.options, function (o) {
            return o.selected ? o.value : null;
          }).filter(function (v) { return v != null; });
        } else if (el.type === 'checkbox') {
          draft.serviceValues[key] = !!el.checked;
        } else {
          draft.serviceValues[key] = el.value;
        }
      }
      el.addEventListener('input', read);
      el.addEventListener('change', read);
    });

    var next = document.getElementById('next1');
    if (next) next.addEventListener('click', function () {
      var st = Store.serviceType(draft.serviceType) || {};
      try {
        if (st.formKind === 'buy') {
          cleanGroups();
        } else {
          var fields = schemaFields(st);
          for (var i = 0; i < fields.length; i++) {
            var f = fields[i];
            if (!f.required) continue;
            var v = draft.serviceValues[f.key];
            if (v == null || v === '' || (Array.isArray(v) && !v.length)) {
              UI.toast('请填写「' + (f.label || f.key) + '」', 'err');
              return;
            }
          }
        }
      } catch (e) { UI.err(e); return; }
      step = 2;
      render();
      scrollTop();
    });
  }

  function bindStep2() {
    Array.prototype.forEach.call(screen.querySelectorAll('[data-addr]'), function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-addr');
        if (v === 'new') draft.addressMode = 'new';
        else {
          draft.addressMode = 'old';
          draft.addressId = Number(v);
        }
        render();
        scrollTop();
      });
    });

    Array.prototype.forEach.call(screen.querySelectorAll('[data-na]'), function (el) {
      el.addEventListener('input', function () {
        draft.newAddr[el.getAttribute('data-na')] = el.value;
      });
    });

    var note = document.getElementById('ordNote');
    if (note) note.addEventListener('input', function () { draft.note = note.value; });

    var feeInput = document.getElementById('feeInput');
    if (feeInput) {
      feeInput.addEventListener('input', function () {
        draft.feeYuan = feeInput.value;
        var fee = feeFen();
        var goods = goodsEstFen();
        var feeLine = document.getElementById('feeLine');
        var total = document.getElementById('sumTotal');
        if (feeLine) feeLine.textContent = money(fee);
        if (total) total.textContent = money(goods + fee);
      });
    }

    var prev = document.getElementById('prev2');
    if (prev) prev.addEventListener('click', function () {
      step = 1;
      render();
      scrollTop();
    });
    var next = document.getElementById('next2');
    if (next) next.addEventListener('click', function () {
      var problem = addressProblem();
      if (problem) { UI.toast(problem, 'err'); return; }
      if (feeFen() <= 0) { UI.toast('跑腿费必须大于 0', 'err'); return; }
      step = 3;
      render();
      scrollTop();
    });
  }

  function bindStep3() {
    var prev = document.getElementById('prev3');
    if (prev) prev.addEventListener('click', function () {
      step = 2;
      render();
      scrollTop();
    });
    var submit = document.getElementById('submitOrder');
    if (submit) submit.addEventListener('click', function () {
      var st = Store.serviceType(draft.serviceType);
      if (!st) { UI.toast('服务类型不存在', 'err'); return; }
      var addr = buildAddress();
      var problem = addressProblem();
      if (problem) { UI.toast(problem, 'err'); return; }
      var fee = feeFen();
      if (fee <= 0) { UI.toast('跑腿费必须大于 0', 'err'); return; }

      var payload = {
        serviceType: draft.serviceType,
        customerId: cust.id,
        address: addr,
        saveAddress: true,
        serviceFeeFen: fee,
        extraFeeFen: 0,
        discountFen: 0,
        service: st.formKind === 'buy' ? {} : draft.serviceValues,
        note: String(draft.note || '').trim(),
        source: 'self'
      };
      try {
        if (st.formKind === 'buy') payload.merchantGroups = cleanGroups();
        submit.disabled = true;
        var o = Store.createOrder(payload);
        step = 0;
        draft = null;
        detailOrderId = null;
        tab = 'orders';
        UI.toast('已提交 ' + o.no + '，等待老板接单', 'ok');
        render();
        scrollTop();
      } catch (e) {
        submit.disabled = false;
        UI.err(e);
      }
    });
  }

  UI.bindTabbar(function (k) { goTab(k); });

  if (!cust) {
    render();
    return;
  }
  render();
})();
</script>
</body>
</html>
