  function serviceSectionHtml(st) {
    var schema = (st && st.schema ? st.schema : []).slice().sort(function (a, b) { return (a.sortNo || 0) - (b.sortNo || 0); });
    var fields = schema.map(function (f) {
      var val = state.draft.service[f.key];
      var label = '<label class="fl' + (f.required ? ' req' : '') + '">' + UI.esc(f.label) + '</label>';
      var ph = ' placeholder="' + UI.esc(f.placeholder || '') + '"';
      if (f.type === 'textarea') {
        return '<div class="field">' + label + '<textarea rows="2" data-svc="' + f.key + '"' + ph + '>' + UI.esc(val || '') + '</textarea></div>';
      }
      if (f.type === 'select') {
        var opts = (f.options || []).map(function (o) {
          var v = typeof o === 'object' ? (o.value != null ? o.value : o.label) : o;
          var l = typeof o === 'object' ? (o.label || o.value) : o;
          return '<option value="' + UI.esc(v) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + UI.esc(l) + '</option>';
        }).join('');
        return '<div class="field">' + label + '<select data-svc="' + f.key + '"><option value="">请选择</option>' + opts + '</select></div>';
      }
      if (f.type === 'multiselect') {
        var arr = Array.isArray(val) ? val : [];
        var chips = (f.options || []).map(function (o) {
          var v = typeof o === 'object' ? (o.value != null ? o.value : o.label) : o;
          var l = typeof o === 'object' ? (o.label || o.value) : o;
          return '<button type="button" class="chip ' + (arr.indexOf(v) >= 0 ? 'on' : '') + '" data-msgroup="' + f.key + '" data-msval="' + UI.esc(v) + '">' + UI.esc(l) + '</button>';
        }).join('');
        return '<div class="field">' + label + '<div class="chips">' + chips + '</div></div>';
      }
      if (f.type === 'switch') {
        return '<div class="field">' + label + '<label class="switch"><input type="checkbox" data-svc="' + f.key + '"' +
          (val ? ' checked' : '') + '> 是</label></div>';
      }
      var type = f.type === 'phone' ? 'tel' : (f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text'));
      return '<div class="field">' + label + '<input type="' + type + '" data-svc="' + f.key + '"' + ph +
        ' value="' + UI.esc(val == null ? '' : val) + '"></div>';
    }).join('');
    return '<div class="section-title">服务信息</div><div class="card">' + fields +
      '<div class="grid2"><div class="field"><label class="fl">联系人</label>' +
      '<input data-svc="contactName" value="' + UI.esc(state.draft.service.contactName || '') + '"></div>' +
      '<div class="field"><label class="fl">联系电话</label>' +
      '<input data-svc="contactPhone" inputmode="tel" value="' + UI.esc(state.draft.service.contactPhone || '') + '"></div></div></div>';
  }

  function renderStep2() {
    var box = document.getElementById('wStep');
    var st = Store.serviceType(state.draft.serviceType);
    var isBuy = !!(st && st.formKind === 'buy');
    box.innerHTML = customerSectionHtml() + addressSectionHtml(isBuy) +
      (isBuy ? wizardGroupsHtml() : serviceSectionHtml(st));
    bindCustomerSection();
    bindAddressSection();
    if (isBuy) bindWizardGroups();
    else bindServiceFields();
  }

  function selectDraftCustomer(id) {
    state.draft.customerId = id;
    var c = Store.customer(id);
    var u = c ? Store.user(c.userId) : null;
    if (u) {
      state.draft.addr.contactName = u.name;
      state.draft.addr.phone = u.phone;
    }
    if (c && c.addresses && c.addresses.length) {
      var a = c.addresses[0];
      state.draft.addressId = a.id;
      state.draft.addr = {
        poi: a.poi, detail: a.detail || '',
        contactName: a.contactName || (u ? u.name : ''),
        phone: a.phone || (u ? u.phone : '')
      };
    } else {
      state.draft.addressId = null;
      state.draft.addr = { poi: '', detail: '', contactName: u ? u.name : '', phone: u ? u.phone : '' };
    }
    renderStep2();
  }

  function bindCustomerSection() {
    var input = document.getElementById('wCustSearch');
    var sug = document.getElementById('wCustSug');
    function show() {
      var q = input.value.trim().toLowerCase();
      var list = Store.get().customers.map(function (c) { return { c: c, u: Store.user(c.userId) }; })
        .filter(function (x) {
          if (!x.u) return false;
          return !q || [x.u.name, x.u.phone, x.c.note].join(' ').toLowerCase().indexOf(q) >= 0;
        }).slice(0, 6);
      sug.innerHTML = list.length ? list.map(function (x) {
        return '<button type="button" class="sug-item" data-cust="' + x.c.id + '"><b>' + UI.esc(x.u.name) + '</b>' +
          ' <span class="small muted">' + UI.esc(x.u.phone) + '</span>' +
          '<div class="small muted">' + UI.esc(x.c.note || '无备注') + ' · 欠 ' + money(Math.max(0, Store.debtOf(x.c.id))) + '</div></button>';
      }).join('') : '<div class="sug-empty">没搜到，点「＋ 新客」当场建档。</div>';
      sug.classList.remove('hide');
      qa('[data-cust]', sug).forEach(function (b) {
        b.addEventListener('click', function () { selectDraftCustomer(Number(b.getAttribute('data-cust'))); });
      });
    }
    input.addEventListener('input', show);
    input.addEventListener('focus', function () { if (input.value.trim()) show(); });

    var form = document.getElementById('wCustForm');
    var newBtn = page.querySelector('[data-newcust]');
    if (newBtn) {
      newBtn.addEventListener('click', function () {
        sug.classList.add('hide');
        form.classList.toggle('hide');
      });
    }
    var cancel = page.querySelector('[data-nccancel]');
    if (cancel) cancel.addEventListener('click', function () { form.classList.add('hide'); });
    var save = page.querySelector('[data-ncsave]');
    if (save) {
      save.addEventListener('click', function () {
        try {
          var c = Store.addCustomer({
            name: document.getElementById('wNcName').value,
            phone: document.getElementById('wNcPhone').value,
            note: document.getElementById('wNcNote').value,
            password: '123456',
            address: {
              poi: document.getElementById('wNcPoi').value,
              detail: document.getElementById('wNcDetail').value
            }
          });
          UI.toast('客户已建档并选中', 'ok');
          selectDraftCustomer(c.id);
        } catch (e) { UI.err(e); }
      });
    }
    var clear = page.querySelector('[data-custclear]');
    if (clear) {
      clear.addEventListener('click', function () {
        state.draft.customerId = null;
        state.draft.addressId = null;
        state.draft.addr = { poi: '', detail: '', contactName: '', phone: '' };
        renderStep2();
      });
    }
  }

  function bindAddressSection() {
    qa('[data-addrsel]', page).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-addrsel'));
        var c = state.draft.customerId ? Store.customer(state.draft.customerId) : null;
        var a = c && c.addresses ? c.addresses.filter(function (x) { return x.id === id; })[0] : null;
        if (!a) return;
        state.draft.addressId = a.id;
        state.draft.addr = {
          poi: a.poi, detail: a.detail || '',
          contactName: a.contactName || state.draft.addr.contactName,
          phone: a.phone || state.draft.addr.phone
        };
        renderStep2();
      });
    });
    qa('[data-addrnew]', page).forEach(function (b) {
      b.addEventListener('click', function () {
        state.draft.addressId = null;
        state.draft.addr = {
          poi: '', detail: '',
          contactName: state.draft.addr.contactName,
          phone: state.draft.addr.phone
        };
        renderStep2();
      });
    });
    var map = {
      addrpoi: 'poi', addrdetail: 'detail', addrcontact: 'contactName', addrphone: 'phone'
    };
    qa('[data-addrpoi],[data-addrdetail],[data-addrcontact],[data-addrphone]', page).forEach(function (el) {
      el.addEventListener('input', function () {
        var key = map[el.getAttribute('data-addrpoi') != null ? 'addrpoi' : (
          el.getAttribute('data-addrdetail') != null ? 'addrdetail' : (
            el.getAttribute('data-addrcontact') != null ? 'addrcontact' : 'addrphone'))];
        state.draft.addressId = null;
        state.draft.addr[key] = el.value;
      });
    });
  }

  function bindServiceFields() {
    qa('[data-svc]', page).forEach(function (el) {
      var key = el.getAttribute('data-svc');
      function sync() {
        state.draft.service[key] = el.type === 'checkbox' ? el.checked : el.value;
      }
      el.addEventListener('input', sync);
      el.addEventListener('change', sync);
    });
    qa('[data-msgroup]', page).forEach(function (b) {
      b.addEventListener('click', function () {
        var key = b.getAttribute('data-msgroup');
        var val = b.getAttribute('data-msval');
        var arr = Array.isArray(state.draft.service[key]) ? state.draft.service[key].slice() : [];
        var i = arr.indexOf(val);
        if (i >= 0) arr.splice(i, 1);
        else arr.push(val);
        state.draft.service[key] = arr;
        b.classList.toggle('on');
      });
    });
  }

  function bindWizardGroups() {
    var wrap = document.getElementById('wGroups');
    function rerender() {
      wrap.innerHTML = state.draft.groups.map(function (g, i) {
        return groupCardHtml(g, i, state.draft.groups.length > 1);
      }).join('');
      bindGroupCards(wrap, state.draft.groups, rerender, { removable: state.draft.groups.length > 1 });
    }
    bindGroupCards(wrap, state.draft.groups, rerender, { removable: state.draft.groups.length > 1 });
    var add = page.querySelector('[data-addgroup]');
    if (add) {
      add.addEventListener('click', function () {
        state.draft.groups.push(newGroup());
        rerender();
      });
    }
  }

  function fail(msg) {
    UI.toast(msg, 'err');
    return false;
  }

  function currentAddress() {
    var d = state.draft;
    if (d.addressId && d.customerId) {
      var c = Store.customer(d.customerId);
      var a = c && c.addresses ? c.addresses.filter(function (x) { return x.id === Number(d.addressId); })[0] : null;
      if (a) return { poi: a.poi, detail: a.detail || '', contactName: a.contactName || '', phone: a.phone || '' };
    }
    if (hasText(d.addr.poi) || hasText(d.addr.detail)) {
      return {
        poi: String(d.addr.poi).trim(), detail: String(d.addr.detail).trim(),
        contactName: String(d.addr.contactName || '').trim(), phone: String(d.addr.phone || '').trim()
      };
    }
    return null;
  }

  function validateStep2() {
    var d = state.draft;
    if (!d.customerId) return fail('先选客户，或者当场新建一个');
    var st = Store.serviceType(d.serviceType);
    var isBuy = !!(st && st.formKind === 'buy');
    var addr = currentAddress();
    if (isBuy && !addr) return fail('代买要填收货地址');
    if (isBuy) {
      if (!d.groups.length) return fail('至少填一家要去的店');
      for (var i = 0; i < d.groups.length; i++) {
        var g = d.groups[i];
        if (!g.merchantId && !hasText(g.merchantName)) return fail('第 ' + (i + 1) + ' 组要选商家或填店名');
        var items = groupItemsPayload(g);
        if (!items.length) return fail('第 ' + (i + 1) + ' 组至少要有一件物品');
        if (items.some(function (x) { return x.estFen < 0; })) return fail('估价不能为负');
      }
    } else {
      var schema = (st && st.schema) ? st.schema : [];
      for (var j = 0; j < schema.length; j++) {
        var f = schema[j];
        if (!f.required) continue;
        var v = d.service[f.key];
        if (v == null || v === '' || (Array.isArray(v) && !v.length)) return fail(f.label + '要填');
      }
    }
    return true;
  }

  function renderAttachList() {
    var box = document.getElementById('wAttachList');
    if (!box) return;
    box.innerHTML = UI.attachHtml(state.draft.attachments, true);
    qa('[data-rm]', box).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-rm');
        state.draft.attachments = state.draft.attachments.filter(function (a) { return String(a.id) !== id; });
        renderAttachList();
      });
    });
    qa('[data-play]', box).forEach(function (b) {
      b.addEventListener('click', function () { UI.toast('原型不播放真实音频；正式版这里是语音条', 'ok'); });
    });
  }

  function renderStep3() {
    var d = state.draft;
    if (!hasText(d.feeYuan)) {
      var st = Store.serviceType(d.serviceType);
      d.feeYuan = UI.yuan(st ? st.defaultFeeFen : Store.settings().defaultFeeFen);
    }
    var riders = Store.riders();
    var box = document.getElementById('wStep');
    box.innerHTML = '<div class="section-title">费用</div><div class="card">' +
      '<div class="grid2"><div class="field"><label class="fl req">跑腿费（元）</label>' +
      '<input id="wFee" inputmode="decimal" value="' + UI.esc(d.feeYuan) + '"></div>' +
      '<div class="field"><label class="fl">附加费（元）</label>' +
      '<input id="wExtra" inputmode="decimal" value="' + UI.esc(d.extraYuan) + '" placeholder="停车 / 过路"></div></div>' +
      '<div class="field"><label class="fl">优惠（元）</label>' +
      '<input id="wDiscount" inputmode="decimal" value="' + UI.esc(d.discountYuan) + '"></div>' +
      '<div class="hint">代买的货款不在这里收；骑手取货时按实际金额录入，跑腿费只收一次。</div>' +
      '<div class="field" style="margin-top:12px"><label class="fl">订单备注</label>' +
      '<textarea id="wNote" rows="2" placeholder="客户原话、门禁、注意事项">' + UI.esc(d.note) + '</textarea></div>' +
      '<div class="field"><label class="fl">附件（可多选）</label>' +
      '<div class="file-drop"><input type="file" id="wFiles" multiple accept="image/*,audio/*">' +
      '<div class="hint">原型只记录文件名和类型，不做上传。</div></div>' +
      '<div id="wAttachList"></div></div>' +
      '<div class="field"><label class="fl">指派骑手（可选）</label>' +
      '<select id="wRider"><option value="">不指派 · 先留在待派单</option>' +
      riders.map(function (r) {
        return '<option value="' + r.id + '"' + (String(d.riderId) === String(r.id) ? ' selected' : '') + '>' +
          UI.esc(r.name) + '（' + UI.esc(r.phone) + '）</option>';
      }).join('') + '</select></div></div>';

    document.getElementById('wFee').addEventListener('input', function (e) {
      d.feeYuan = e.target.value; d.feeTouched = true;
    });
    document.getElementById('wExtra').addEventListener('input', function (e) { d.extraYuan = e.target.value; });
    document.getElementById('wDiscount').addEventListener('input', function (e) { d.discountYuan = e.target.value; });
    document.getElementById('wNote').addEventListener('input', function (e) { d.note = e.target.value; });
    document.getElementById('wRider').addEventListener('change', function (e) { d.riderId = e.target.value; });
    document.getElementById('wFiles').addEventListener('change', function (e) {
      var files = Array.prototype.slice.call(e.target.files || []);
      files.forEach(function (f, i) {
        d.attachments.push({
          id: Date.now() + i,
          kind: (f.type || '').indexOf('audio') === 0 ? 'audio' : 'image',
          name: f.name,
          size: Math.round(f.size / 1024) + 'KB'
        });
      });
      renderAttachList();
    });
    renderAttachList();
  }

  function summaryLine(k, v) {
    return '<div class="summary-line"><span class="k">' + UI.esc(k) + '</span><span class="v">' + UI.esc(v) + '</span></div>';
  }

  function renderStep4() {
    var d = state.draft;
    var st = Store.serviceType(d.serviceType);
    var isBuy = !!(st && st.formKind === 'buy');
    var cu = d.customerId ? custOf({ customerId: d.customerId }) : null;
    var addr = currentAddress();
    var rider = d.riderId ? Store.user(Number(d.riderId)) : null;
    var goodsEst = 0;
    var groupsHtml = '';

    if (isBuy) {
      groupsHtml = d.groups.map(function (g, i) {
        var m = g.merchantId ? Store.merchant(g.merchantId) : null;
        var name = m ? m.name : (g.merchantName || '未命名商家');
        var items = groupItemsPayload(g);
        items.forEach(function (x) { goodsEst += x.estFen; });
        return '<div class="card" style="margin-top:8px"><div class="row"><b>' + UI.esc(name) + '</b>' +
          '<span class="right badge ' + (m && m.status === 'pending' ? 'amber' : (m ? 'green' : 'slate')) + '">' +
          UI.esc(m ? (m.status === 'pending' ? '待完善' : '已建档') : '自由填写') + '</span></div>' +
          items.map(function (x) {
            return '<div class="item-line"><span class="nm">' + UI.esc(x.text) + (x.qty > 1 ? ' × ' + x.qty : '') + '</span>' +
              '<span class="pr">' + (x.estFen ? money(x.estFen) : '未估价') + '</span></div>';
          }).join('') +
          (g.note ? '<div class="hint">备注：' + UI.esc(g.note) + '</div>' : '') + '</div>';
      }).join('');
    } else {
      var schema = (st && st.schema ? st.schema : []).slice().sort(function (a, b) { return (a.sortNo || 0) - (b.sortNo || 0); });
      groupsHtml = '<div class="card">' + schema.map(function (f) {
        var v = d.service[f.key];
        if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '';
        return summaryLine(f.label, Array.isArray(v) ? v.join('、') : (f.type === 'switch' ? (v ? '是' : '否') : v));
      }).join('') +
        (d.service.contactName ? summaryLine('联系人', d.service.contactName + (d.service.contactPhone ? ' · ' + d.service.contactPhone : '')) : '') +
        '</div>';
    }

    var box = document.getElementById('wStep');
    box.innerHTML = '<div class="section-title">确认信息</div>' +
      '<div class="card">' +
      summaryLine('服务类型', st ? st.name : d.serviceType) +
      summaryLine('客户', cu && cu.u ? cu.u.name + ' · ' + cu.u.phone : '未选') +
      summaryLine('地址', addr ? addr.poi + (addr.detail ? ' · ' + addr.detail : '') : '未填') +
      summaryLine('联系人', addr && addr.contactName ? addr.contactName + (addr.phone ? ' · ' + addr.phone : '') : '—') +
      summaryLine('骑手', rider ? rider.name : '不指派（待派单）') +
      '</div>' +
      '<div class="section-title" style="margin-top:14px">' + (isBuy ? '商家与物品' : '服务内容') + '</div>' +
      groupsHtml +
      '<div class="section-title" style="margin-top:14px">费用</div><div class="card">' +
      (isBuy ? summaryLine('货款估价', money(goodsEst)) : '') +
      summaryLine('跑腿费', money(fen(d.feeYuan))) +
      summaryLine('附加费', money(fen(d.extraYuan))) +
      summaryLine('优惠', fen(d.discountYuan) ? '-' + money(fen(d.discountYuan)) : money(0)) +
      summaryLine('预计应收', money(goodsEst + fen(d.feeYuan) + fen(d.extraYuan) - fen(d.discountYuan))) +
      '</div>' +
      '<div class="card" style="margin-top:10px">' +
      summaryLine('备注', d.note || '—') +
      summaryLine('附件', d.attachments.length ? d.attachments.length + ' 个' : '无') + '</div>' +
      '<div class="hint">提交后进入待派单或按所选骑手直接推进。</div>';
  }

  function submitDraft() {
    var d = state.draft;
    if (!d) return;
    var st = Store.serviceType(d.serviceType);
    if (!st) return fail('先选服务类型');
    if (!d.customerId) return fail('先选客户，或者当场新建一个');
    var fee = fen(d.feeYuan);
    if (fee <= 0) return fail('跑腿费必须大于 0');
    var isBuy = st.formKind === 'buy';
    var addr = currentAddress();
    if (isBuy && !addr) return fail('代买要填收货地址');
    var payload = {
      serviceType: d.serviceType,
      customerId: d.customerId,
      address: addr,
      saveAddress: !!addr && !d.addressId,
      merchantGroups: isBuy ? d.groups.map(groupPayload) : [],
      serviceFeeFen: fee,
      extraFeeFen: fen(d.extraYuan),
      discountFen: fen(d.discountYuan),
      service: d.service,
      riderId: d.riderId ? Number(d.riderId) : null,
      attachments: d.attachments,
      note: d.note,
      source: 'phone'
    };
    if (!addr && !isBuy && hasText(d.service.origin)) {
      payload.address = {
        poi: d.service.origin, detail: '',
        contactName: d.service.contactName || '', phone: d.service.contactPhone || ''
      };
      payload.saveAddress = false;
    }
    try {
      var o = Store.createOrder(payload);
      state.wizard = false;
      state.draft = null;
      state.view = 'kanban';
      state.kstatus = '';
      state.kq = '';
      state.detailId = o.id;
      setChrome(false);
      setTopTitle('订单详情');
      try { history.replaceState(null, '', 'dispatch.html'); } catch (e) { /* file:// 下可能不支持 */ }
      syncTabbar();
      renderDetail(false);
      UI.toast('已建单 ' + o.no, 'ok');
    } catch (e) { UI.err(e); }
  }

  function wizardNext() {
    var d = state.draft;
    if (!d) return;
    if (state.wizardStep === 1) {
      if (!Store.serviceType(d.serviceType)) return fail('先选服务类型');
      state.wizardStep = 2;
    } else if (state.wizardStep === 2) {
      if (!validateStep2()) return;
      state.wizardStep = 3;
    } else if (state.wizardStep === 3) {
      if (fen(d.feeYuan) <= 0) return fail('跑腿费必须大于 0');
      state.wizardStep = 4;
    } else {
      submitDraft();
      return;
    }
    renderWizard();
    window.scrollTo(0, 0);
  }
  function wizardPrev() {
    if (state.wizardStep <= 1) { closeWizard(); return; }
    state.wizardStep -= 1;
    renderWizard();
    window.scrollTo(0, 0);
  }

  function refreshNow(showToast) {
    if (state.wizard) return;
    if (state.detailId) {
      if (Store.order(state.detailId)) renderDetail(true);
      else closeDetail();
    } else {
      renderMain();
    }
    if (showToast) UI.toast('已刷新', 'ok');
  }

  /* ================= 事件 ================= */
  page.addEventListener('click', function (e) {
    var play = e.target.closest('[data-play]');
    if (play) { UI.toast('原型不播放真实音频；正式版这里是语音条', 'ok'); return; }

    var back = e.target.closest('[data-back]');
    if (back) { closeDetail(); return; }

    var wback = e.target.closest('[data-wback]');
    if (wback) { closeWizard(); return; }

    var wprev = e.target.closest('[data-wprev]');
    if (wprev) { wizardPrev(); return; }

    var wnext = e.target.closest('[data-wnext]');
    if (wnext) { wizardNext(); return; }

    var refresh = e.target.closest('[data-refresh]');
    if (refresh) { refreshNow(true); return; }

    var kchip = e.target.closest('[data-kstatus]');
    if (kchip) {
      var code = kchip.getAttribute('data-kstatus');
      state.kstatus = code === '' ? '' : (state.kstatus === code ? '' : code);
      qa('[data-kstatus]', page).forEach(function (x) {
        x.classList.toggle('on', x.getAttribute('data-kstatus') === state.kstatus);
      });
      renderKanbanList();
      return;
    }

    var dbtn = e.target.closest('[data-odate]');
    if (dbtn) {
      state.odate = dbtn.getAttribute('data-odate');
      qa('[data-odate]', page).forEach(function (x) {
        x.classList.toggle('on', x.getAttribute('data-odate') === state.odate);
      });
      renderOrdersList();
      return;
    }

    var gact = e.target.closest('[data-gact]');
    if (gact) {
      handleGroupAction(gact.getAttribute('data-gact'), gact.getAttribute('data-gid'));
      return;
    }

    var act = e.target.closest('[data-act]');
    if (act) {
      handleAction(act.getAttribute('data-act'), act.getAttribute('data-gid'));
      return;
    }

    var card = e.target.closest('[data-oid]');
    if (card) { openDetail(Number(card.getAttribute('data-oid'))); return; }
  });

  /* ================= 初始化 ================= */
  renderMain();

  if (qs.get('new') === '1') {
    setTimeout(function () { openWizard(); }, 60);
  } else if (qs.get('order')) {
    setTimeout(function () { openDetail(Number(qs.get('order'))); }, 60);
  }

  setInterval(function () {
    if (state.wizard) return;
    if (document.querySelector('.sheet-mask, .modal-mask')) return;
    var ae = document.activeElement;
    if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
    if (state.detailId) {
      if (!Store.order(state.detailId)) { closeDetail(); return; }
      renderDetail(true);
    } else {
      renderMain();
    }
  }, 8000);
})();
</script>
</body>
</html>
